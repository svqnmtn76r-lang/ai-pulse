# Rotating product-article topics for the daily pipeline cadence.
#
# Each entry generates ONE commercial article (comparison or deep_dive). The
# affiliate `product` MUST be named in the piece so the brand>=1 matcher attaches
# it; the article then carries the product-page affiliate_url (from
# data/affiliate_sources.yml) and the FTC disclosure.
#
# ORDERING = PRIORITY. The cadence consumes topics top-down, skipping any whose
# output already exists (any date). TRACKED-URL products (ElevenLabs, Shopify,
# Kinsta — the ones with a real tracked affiliate link today) are listed FIRST so
# forward generation prioritises monetizable, revenue-attributable articles. The
# remaining products match relevantly and target buyer-intent SEO, but their links
# are plain product pages until Hiro adds tracked URLs in affiliate_sources.yml.
#
# Keep topics FRESH — already-generated titles are intentionally NOT relisted here
# (dedup is by slug, so relisting is harmless but noisy). When the list runs low
# the pipeline logs "rotation exhausted — add topics" and generates nothing for
# the cadence (no error, no repeat). Hiro tunes the rate (PRODUCT_* env vars in
# src/pipeline/run.py) + extends this catalogue.
#
# Fields: type (comparison|deep_dive), product (must match a programs.<id> in
# data/affiliate_sources.yml), title (buyer-intent, SEO-sound).

# ── Tracked-URL products (priority: real affiliate link today) ──────────────

