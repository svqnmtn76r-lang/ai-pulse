name: Daily Article Pipeline

on:
  schedule:
    - cron: '0 1 * * *'  # 毎日 UTC 01:00（AEST 11:00）
  workflow_dispatch:

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 -m src.pipeline.run
          python3 scripts/sync_articles_to_blog.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'blog/package-lock.json'

      - name: Build blog
        run: |
          cd blog
          npm ci
          npm run build

      - name: Commit new articles
        run: |
          git config user.name "AI-Pulse Bot"
          git config user.email "bot@aipulse.pages.dev"
          git add output/articles/ blog/src/content/articles/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-generated articles $(date -u +%Y-%m-%d)"
            git push
          fi
