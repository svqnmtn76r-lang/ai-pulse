name: Daily Article Pipeline

on:
  schedule:
    - cron: '0 1 * * *'  # 毎日 UTC 01:00（AEST 11:00）
  workflow_dispatch:

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 -m src.pipeline.run
          # Self-repair: reconcile in-body affiliate blocks for ALL existing
          # articles against the CURRENT matcher + config (affiliate_sources.yml).
          # Idempotent + href-aware, so config/URL changes (e.g. future real
          # tracked links) propagate to already-published articles, and stale
          # matches (false disclosures) are repaired. PYTHONPATH=. so the script
          # can import the src package when run by path.
          PYTHONPATH=. python3 scripts/inject_affiliate_blocks.py output/articles
          python3 scripts/sync_articles_to_blog.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'blog/package-lock.json'

      - name: Build blog
        run: |
          cd blog
          npm ci
          npm run build

      - name: Commit new articles
        run: |
          set -euo pipefail
          git config user.name "AI-Pulse Bot"
          git config user.email "bot@aipulse.pages.dev"

          # Stage generated content + data (gitignored DBs are skipped automatically).
          git add output/articles/ blog/src/content/articles/ data/

          # Skip cleanly when there is nothing to commit (success, not failure).
          if git diff --staged --quiet; then
            echo "No changes to commit — skipping."
            exit 0
          fi

          git commit -m "chore: auto-generated articles $(date -u +%Y-%m-%d)"

          # The remote may have advanced while this job ran (manual pushes or an
          # overlapping run), which previously caused a non-fast-forward 'rejected'
          # push. Rebase onto the latest origin/main, then push — retry to absorb a
          # race with a concurrent pusher.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || { echo "rebase failed"; exit 1; }
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected (remote advanced); retrying..."
            sleep 5
          done
          echo "Failed to push after retries." >&2
          exit 1
